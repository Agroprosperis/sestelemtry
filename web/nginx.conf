# The dashboard over HTTPS: the static bundle, with the API (and its
# health probes and Swagger) proxied to the api container. The
# certificate is mounted from the host at /etc/nginx/tls: tls.crt holds
# the server certificate followed by the intermediate CA, tls.key its
# private key.

# Resolve "api" per request through Docker's DNS, so a recreated api
# container (new IP) doesn't leave nginx proxying to the old one.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The askoe archive import uploads up to 32 MB.
    client_max_body_size 40m;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # A new build must reach the browser on the next load; the assets it
    # references are fingerprinted, so those can be cached for good.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/(api/|healthz$|readyz$|swagger) {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Imports and the economics recompute stream NDJSON progress,
        # which buffering would hold back until the end.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
