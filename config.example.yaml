database_url: "postgres://postgres:postgres@localhost:5432/telemetry?sslmode=disable"
register_catalog: registers/huawei_smartlogger.yaml

# Override catalog addressing if your map uses a different convention (0 = use address as PDU).
register_addressing:
  holding_address_base: 0

# holding | input — SmartLogger table uses holding-style 4xxxx maps (FC3).
modbus_register_map: holding

organizations:
  - id: demo-org
    name: Demo organization
    site_id: site-a
    device_id: smartlogger-1
    poll_interval: 15s
    # ess_discharge_sign: flips the instantaneous-power sign convention
    # for inverters that report charge as positive ESS power. Allowed: 1
    # (default) or -1. Cumulative charge/discharge counters are sign-
    # invariant, so this only affects the energy-flow sanity check.
    # ess_discharge_sign: 1
    #
    # ess_max_power_kw: OPTIONAL override of the ESS charge/discharge
    # power ceiling (kW) used by the energy-flow counter-step guard. The
    # allocator drops any interval whose implied average ESS power
    # exceeds it — a guard against cumulative-counter steps (device
    # re-base / firmware resync / corrupted reading) that would otherwise
    # dump a huge fake charge/discharge into one hour. Leave it unset:
    # a fleet-wide default (DefaultMaxEssPowerKw, 10 MW) already applies.
    # Only set this for an unusually large site that the default would
    # clip. ess_max_power_kw: 20000
    # `location` is optional and is exposed to the dashboard via
    # /api/v1/organizations. The weather widget uses it to query
    # Open-Meteo for the right coordinates; orgs without a location
    # block simply hide the widget.
    location:
      latitude: 50.4501
      longitude: 30.5234
      city: "Київ"
    modbus:
      host: 192.168.1.50
      port: 502
      unit_id: 99
      connect_timeout: 5s
      request_timeout: 5s

  - id: other-org
    name: Second tenant
    poll_interval: 30s
    modbus:
      host: 10.0.0.20
      port: 502
      unit_id: 99

  # An organization can also be backed by several Modbus devices. Each
  # device declares a `metric_keys` whitelist that selects which catalog
  # entries it owns; samples are written under the same organization_id.
  # Use this when the physical site splits e.g. ESS and PV across two
  # SmartLoggers but should appear as one org on the dashboard.
  - id: multi-tenant
    name: Multi-device tenant
    poll_interval: 1s
    modbus_devices:
      - host: 10.0.0.30
        port: 502
        unit_id: 99
        connect_timeout: 2s
        request_timeout: 2s
        metric_keys:
          - active_ess_power_kw
          - energy_charged_day_kwh
          - energy_discharged_day_kwh
          - local_time_epoch_s        # SmartLogger clock check
      - host: 10.0.0.31
        port: 502
        unit_id: 99
        connect_timeout: 2s
        request_timeout: 2s
        metric_keys:
          - pv_energy_yield_day_kwh
          - load_power_kw
          - grid_connected_active_power_kw
          - local_time_epoch_s

  # Real production sites use a single SmartLogger and the canonical
  # poll cadence (1s). Coordinates feed the Open-Meteo weather widget.
  - id: ab
    name: Агродар Бар
    poll_interval: 1s
    location:
      latitude: 49.0406538
      longitude: 27.7419296
      city: "Бар"
    modbus:
      host: 10.23.40.251
      port: 502
      unit_id: 99
      connect_timeout: 2s
      request_timeout: 2s

  - id: ke
    name: Кролевецький елеватор
    poll_interval: 1s
    location:
      latitude: 51.564077
      longitude: 33.375058
      city: "Кролевець"
    modbus:
      host: 10.24.40.238
      port: 502
      unit_id: 99
      connect_timeout: 2s
      request_timeout: 2s

  # Поділля елеватор. Internal id is `pde` to keep it distinct from a
  # different production tenant that already owns `id: pe`.
  - id: pde
    name: Поділля елеватор
    poll_interval: 1s
    location:
      latitude: 49.9993363781658
      longitude: 26.386386689961547
      city: "Поділля"
    modbus:
      host: 10.33.40.241
      port: 502
      unit_id: 99
      connect_timeout: 2s
      request_timeout: 2s

  - id: de
    name: Дубовязівський елеватор
    poll_interval: 1s
    location:
      latitude: 51.15119965
      longitude: 33.383904
      city: "Дубовʼязівка"
    modbus:
      host: 10.34.40.241
      port: 502
      unit_id: 99
      connect_timeout: 2s
      request_timeout: 2s

  - id: sm
    name: Сорочанський мірошник
    poll_interval: 1s
    location:
      latitude: 49.066043
      longitude: 29.3634120
      city: "Сорочани"
    modbus:
      host: 10.36.40.102
      port: 502
      unit_id: 99
      connect_timeout: 2s
      request_timeout: 2s

# Day-Ahead Market (RDN) prices from oree.com.ua (consumed by dam-collector).
# Set enabled: false to skip running the dam-collector against this config.
oree:
  enabled: true
  base_url: "https://www.oree.com.ua"
  zone: 2                       # 1 = Burshtyn island, 2 = unified UA grid (default)
  run_at: "15:30"               # HH:MM in `timezone` to run the daily fetch
  timezone: "Europe/Kyiv"
  delivery_offset_days: 1       # 1 = "tomorrow", 0 = "today", -1 = "yesterday"
  backfill_days: 7              # re-check the last N past days; fetch any with <24h (0 disables)
  http_timeout: 30s
  user_agent: "sestelemetry-dam/1.0"
  retry:
    attempts: 5
    backoff: 5m

# Open-Meteo forecast cache (consumed by weather-collector + /api/v1/weather-forecast).
# The collector fetches a fresh forecast every `interval` for each org with a
# `location` block and upserts (organization_id, hour) rows — no history is kept.
# Set enabled: false to skip running the weather-collector against this config.
weather:
  enabled: true
  base_url: "https://api.open-meteo.com/v1/forecast"
  interval: 1h
  # Re-pull this many recent past days each tick to backfill the
  # freeze-on-past cache for days/orgs the collector missed (newly
  # added org, downtime). Existing frozen rows are never overwritten.
  # Max 92 (Open-Meteo limit); defaults to 7 when unset.
  past_days: 7
  http_timeout: 30s
  user_agent: "sestelemetry-weather/1.0"
  retry:
    attempts: 3
    backoff: 5s

# Scheduled economics recompute (consumed by economics-recompute).
# Recomputes + persists hourly/daily economics in the background so the
# dashboard always reads a warm cache instead of triggering a slow live
# recompute. Reads only the local database — never calls FusionSolar.
# Set enabled: false to skip running the economics-recompute daemon.
economics:
  enabled: true
  run_at: "03:00"               # HH:MM in `timezone`: nightly finalize pass
  timezone: "Europe/Kyiv"
  finalize_days: 3              # nightly: recompute the last N days (ending yesterday)
  today_interval: 1h            # refresh the current (non-final) day this often
  max_concurrency: 2            # how many orgs to recompute in parallel

# Connectivity alerts (consumed by alert-watchdog). Every `check_interval`
# the watchdog reads the freshest telemetry timestamp of every configured
# Modbus device; a device silent for longer than `stale_after` is reported
# as "connection lost" by email. Because the check reads the database
# rather than the Modbus link, it also catches a dead collector process.
#
# STARTING VALUES ONLY. The dashboard's notifications page (?view=alerts) is
# the source of truth: once it is saved, these settings live in the database
# (per-organization recipients and switches too) and the watchdog picks up
# changes without a restart. This block is what the page shows — and what the
# watchdog acts on — until that first save.
alerts:
  enabled: false
  check_interval: 1m            # how often to sample freshness
  stale_after: 10m              # silence longer than this = connection lost
  repeat_interval: 6h           # remind while still down; negative disables
  notify_recovery: true         # also email when a device comes back
  smtp:
    host: smtp.example.com
    port: 587                   # defaults: 587 (starttls/none), 465 (implicit)
    tls: starttls               # starttls | implicit | none
    username: alerts@example.com
    password: ""                # leave empty and pass SMTP_PASSWORD instead
    from: "СЕС Моніторинг <alerts@example.com>"
    to:                         # default recipients; per-org lists live in the UI
      - ops@example.com
    timeout: 20s
