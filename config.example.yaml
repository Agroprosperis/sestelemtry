database_url: "postgres://postgres:postgres@localhost:5432/telemetry?sslmode=disable"
register_catalog: registers/huawei_smartlogger.yaml

# Override catalog addressing if your map uses a different convention (0 = use address as PDU).
register_addressing:
  holding_address_base: 0

# holding | input — SmartLogger table uses holding-style 4xxxx maps (FC3).
modbus_register_map: holding

organizations:
  - id: demo-org
    name: Demo organization
    site_id: site-a
    device_id: smartlogger-1
    poll_interval: 15s
    # `location` is optional and is exposed to the dashboard via
    # /api/v1/organizations. The weather widget uses it to query
    # Open-Meteo for the right coordinates; orgs without a location
    # block simply hide the widget.
    location:
      latitude: 50.4501
      longitude: 30.5234
      city: "Київ"
    modbus:
      host: 192.168.1.50
      port: 502
      unit_id: 99
      connect_timeout: 5s
      request_timeout: 5s

  - id: other-org
    name: Second tenant
    poll_interval: 30s
    modbus:
      host: 10.0.0.20
      port: 502
      unit_id: 99

  # An organization can also be backed by several Modbus devices. Each
  # device declares a `metric_keys` whitelist that selects which catalog
  # entries it owns; samples are written under the same organization_id.
  # Use this when the physical site splits e.g. ESS and PV across two
  # SmartLoggers but should appear as one org on the dashboard.
  - id: multi-tenant
    name: Multi-device tenant
    poll_interval: 1s
    modbus_devices:
      - host: 10.0.0.30
        port: 502
        unit_id: 99
        connect_timeout: 2s
        request_timeout: 2s
        metric_keys:
          - active_ess_power_kw
          - energy_charged_day_kwh
          - energy_discharged_day_kwh
          - local_time_epoch_s        # SmartLogger clock check
      - host: 10.0.0.31
        port: 502
        unit_id: 99
        connect_timeout: 2s
        request_timeout: 2s
        metric_keys:
          - pv_energy_yield_day_kwh
          - load_power_kw
          - grid_connected_active_power_kw
          - local_time_epoch_s

# Day-Ahead Market (RDN) prices from oree.com.ua (consumed by dam-collector).
# Set enabled: false to skip running the dam-collector against this config.
oree:
  enabled: true
  base_url: "https://www.oree.com.ua"
  zone: 2                       # 1 = Burshtyn island, 2 = unified UA grid (default)
  run_at: "15:30"               # HH:MM in `timezone` to run the daily fetch
  timezone: "Europe/Kyiv"
  delivery_offset_days: 1       # 1 = "tomorrow", 0 = "today", -1 = "yesterday"
  http_timeout: 30s
  user_agent: "sestelemetry-dam/1.0"
  retry:
    attempts: 5
    backoff: 5m

# Open-Meteo forecast cache (consumed by weather-collector + /api/v1/weather-forecast).
# The collector fetches a fresh forecast every `interval` for each org with a
# `location` block and upserts (organization_id, hour) rows — no history is kept.
# Set enabled: false to skip running the weather-collector against this config.
weather:
  enabled: true
  base_url: "https://api.open-meteo.com/v1/forecast"
  interval: 1h
  http_timeout: 30s
  user_agent: "sestelemetry-weather/1.0"
  retry:
    attempts: 3
    backoff: 5s
