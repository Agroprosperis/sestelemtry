services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/telemetry?sslmode=disable
    volumes:
      - ../config.docker.yaml:/etc/sestelemetry/config.yaml:ro
      - ../registers:/etc/sestelemetry/registers:ro
    command: ["-config", "/etc/sestelemetry/config.yaml"]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/telemetry?sslmode=disable
    entrypoint: ["/usr/local/bin/api"]
    command: ["-listen", ":8080", "-allow-origin", "*"]
    ports:
      - "8080:8080"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://api:8080
    ports:
      - "5173:5173"

volumes:
  timescaledb_data:
    name: sestelemetry_timescaledb_data
