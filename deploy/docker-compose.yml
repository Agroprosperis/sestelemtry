services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    # Docker defaults /dev/shm to 64 MB, which is too small for Postgres
    # parallel workers operating on the telemetry_samples hypertable —
    # a DISTINCT ON over a day of samples spills shared memory and the
    # query fails with "could not resize shared memory segment … No
    # space left on device". 1 GB gives the planner plenty of room
    # without ballooning host RAM (shm is lazily allocated).
    shm_size: 1gb
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/telemetry?sslmode=disable
    volumes:
      - ${SESTELEMETRY_HOST_CONFIG_PATH:-/etc/sestelemetry/config.yaml}:/etc/sestelemetry/config.yaml:ro
      - ${SESTELEMETRY_HOST_REGISTERS_PATH:-/etc/sestelemetry/registers}:/etc/sestelemetry/registers:ro
    command: ["-config", "/etc/sestelemetry/config.yaml"]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/telemetry?sslmode=disable
      # Lets the notifications page send a test email before an operator
      # has typed the mail password into it (same secret the watchdog
      # uses). A password saved on the page takes precedence.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    # Mount the same YAML the collector reads so the API can populate
    # /api/v1/organizations (org id, display name, location). Without
    # the mount + -config flag the endpoint returns an empty list and
    # frontend features that depend on it (e.g. weather widget) hide.
    volumes:
      - ${SESTELEMETRY_HOST_CONFIG_PATH:-/etc/sestelemetry/config.yaml}:/etc/sestelemetry/config.yaml:ro
      # Server-side FusionSolar archive-import credentials. Create the
      # host file BEFORE starting the container (a missing path makes
      # Docker bind-mount a directory). Defaults next to config.yaml.
      - ${SESTELEMETRY_HOST_FUSIONSOLAR_PATH:-/etc/sestelemetry/fusionsolar.yaml}:/etc/sestelemetry/fusionsolar.yaml:ro
    entrypoint: ["/usr/local/bin/api"]
    command: ["-listen", ":8080", "-allow-origin", "*", "-config", "/etc/sestelemetry/config.yaml", "-fusionsolar-config", "/etc/sestelemetry/fusionsolar.yaml"]
    ports:
      - "8080:8080"

  # Activation is gated by `oree.enabled` in config.yaml; when disabled the
  # daemon idles without touching the network.
  dam-collector:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/telemetry?sslmode=disable
      TZ: Europe/Kyiv
    entrypoint: ["/usr/local/bin/dam-collector"]
    command: ["-config", "/etc/sestelemetry/config.yaml"]
    volumes:
      - ${SESTELEMETRY_HOST_CONFIG_PATH:-/etc/sestelemetry/config.yaml}:/etc/sestelemetry/config.yaml:ro
      - ${SESTELEMETRY_HOST_REGISTERS_PATH:-/etc/sestelemetry/registers}:/etc/sestelemetry/registers:ro

  # Activation is gated by `weather.enabled` in config.yaml. The collector
  # refreshes the Open-Meteo forecast cache every `weather.interval` for each
  # org with a `location` block configured; the daemon idles otherwise.
  weather-collector:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/telemetry?sslmode=disable
      TZ: Europe/Kyiv
    entrypoint: ["/usr/local/bin/weather-collector"]
    command: ["-config", "/etc/sestelemetry/config.yaml"]
    volumes:
      - ${SESTELEMETRY_HOST_CONFIG_PATH:-/etc/sestelemetry/config.yaml}:/etc/sestelemetry/config.yaml:ro
      - ${SESTELEMETRY_HOST_REGISTERS_PATH:-/etc/sestelemetry/registers}:/etc/sestelemetry/registers:ro

  # Activation is gated by `economics.enabled` in config.yaml. When the
  # section is absent or `enabled: false`, the daemon idles. It only
  # reads the local DB (telemetry, DAM prices, tariffs) — no external API.
  economics-recompute:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/telemetry?sslmode=disable
      TZ: Europe/Kyiv
    entrypoint: ["/usr/local/bin/economics-recompute"]
    command: ["-config", "/etc/sestelemetry/config.yaml"]
    volumes:
      - ${SESTELEMETRY_HOST_CONFIG_PATH:-/etc/sestelemetry/config.yaml}:/etc/sestelemetry/config.yaml:ro
      - ${SESTELEMETRY_HOST_REGISTERS_PATH:-/etc/sestelemetry/registers}:/etc/sestelemetry/registers:ro

  # Activation is gated by `alerts.enabled` in config.yaml. Watches how
  # fresh each Modbus device's telemetry is and emails operators when a
  # site goes quiet; idles when disabled. Put the SMTP password in
  # deploy/.env (SMTP_PASSWORD=...) instead of the mounted config so the
  # YAML stays free of secrets.
  alert-watchdog:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/telemetry?sslmode=disable
      TZ: Europe/Kyiv
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    entrypoint: ["/usr/local/bin/alert-watchdog"]
    command: ["-config", "/etc/sestelemetry/config.yaml"]
    volumes:
      - ${SESTELEMETRY_HOST_CONFIG_PATH:-/etc/sestelemetry/config.yaml}:/etc/sestelemetry/config.yaml:ro
      - ${SESTELEMETRY_HOST_REGISTERS_PATH:-/etc/sestelemetry/registers}:/etc/sestelemetry/registers:ro

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: ""
    ports:
      - "5173:5173"

volumes:
  timescaledb_data:
    name: sestelemetry_timescaledb_data
