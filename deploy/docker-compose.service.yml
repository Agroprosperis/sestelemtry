services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SESTELEMETRY_DB_USER}
      POSTGRES_PASSWORD: ${SESTELEMETRY_DB_PASSWORD}
      POSTGRES_DB: ${SESTELEMETRY_DB_NAME}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SESTELEMETRY_DB_USER} -d ${SESTELEMETRY_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - com.centurylinklabs.watchtower.enable=true

  collector:
    image: ${SESTELEMETRY_COLLECTOR_IMAGE}
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: ${SESTELEMETRY_DATABASE_URL}
    volumes:
      - ${SESTELEMETRY_HOST_CONFIG_PATH:-/etc/sestelemetry/config.yaml}:/etc/sestelemetry/config.yaml:ro
      - ${SESTELEMETRY_HOST_REGISTERS_PATH:-/etc/sestelemetry/registers}:/etc/sestelemetry/registers:ro
    command: ["-config", "/etc/sestelemetry/config.yaml"]
    cpus: 0.50
    mem_limit: 256m
    labels:
      - com.centurylinklabs.watchtower.enable=true

  api:
    image: ${SESTELEMETRY_API_IMAGE}
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: ${SESTELEMETRY_DATABASE_URL}
    entrypoint: ["/usr/local/bin/api"]
    command: ["-listen", ":8080", "-allow-origin", "${SESTELEMETRY_API_ALLOW_ORIGIN}"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    cpus: 0.75
    mem_limit: 256m
    labels:
      - com.centurylinklabs.watchtower.enable=true

  web:
    image: ${SESTELEMETRY_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: ${SESTELEMETRY_WEB_API_BASE_URL:-}
    ports:
      - "5173:5173"
    cpus: 0.50
    mem_limit: 256m
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --label-enable
      - --interval
      - "30"
      - --cleanup
      - --rolling-restart

volumes:
  timescaledb_data:
    name: sestelemetry_timescaledb_data
