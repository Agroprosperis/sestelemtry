# Huawei SmartLogger — documented addresses from vendor maps.
# Addresses are treated as direct Modbus FC3 register addresses (no base subtraction).
addressing:
  holding_address_base: 0

registers:
  # Vendor-documented "Local time" register: epoch seconds expressed in
  # the SmartLogger's local timezone (NOT UTC). Useful for detecting
  # clock drift / TZ misconfiguration on the device — operators can
  # compare against the collector's wall clock (server-side UTC) to
  # spot devices that fell out of sync. Stored verbatim (gain = 1) so
  # downstream tools can reconstruct the original UINT32 reading.
  - metric_key: local_time_epoch_s
    name: SmartLogger local time, epoch seconds
    address: 40009
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  - metric_key: active_pv_power_kw
    name: Active PV power, kW
    address: 40388
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: active_ess_power_kw
    name: Active ESS power, kW
    address: 40392
    data_type: INT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: power_supply_from_grid_day_kwh
    name: Power supply from grid today, kWh
    address: 40438
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: pv_energy_yield_day_kwh
    name: PV energy yield of the day, kWh
    address: 40444
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: accumulated_pv_energy_yield_kwh
    name: Accumulated PV energy yield, kWh
    address: 40446
    data_type: INT64
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: accumulated_electricity_purchased_kwh
    name: Accumulated electricity purchased, kWh
    address: 40450
    data_type: INT64
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: accumulated_electricity_sold_kwh
    name: Accumulated electricity sold, kWh
    address: 40454
    data_type: INT64
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: accumulated_power_consumption_kwh
    name: Accumulated power consumption, kWh
    address: 40458
    data_type: INT64
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: total_power_supply_from_grid_kwh
    name: Total power supply from grid, kWh
    address: 40464
    data_type: INT64
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: energy_charged_day_kwh
    name: Current-day charge capacity, kWh
    address: 40468
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: energy_discharged_day_kwh
    name: Energy discharged today, kWh
    address: 40470
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: total_energy_charged_kwh
    name: Total energy charged, kWh
    address: 40472
    data_type: INT64
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: total_energy_discharged_kwh
    name: Total energy discharged, kWh
    address: 40476
    data_type: UINT64
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  # --- EMS edge shadow-control reads (MVP-1, read-only) ---
  # Issue 52: gain column is divisor; our gain = 1/vendor_gain.

  - metric_key: ess_charge_max_kw
    name: Max ESS charge power, kW
    address: 40490
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: ess_discharge_max_kw
    name: Max ESS discharge power, kW
    address: 40492
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: load_power_kw
    name: Load power, kW
    address: 40503
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: grid_connected_active_power_kw
    name: Grid-connected active power, kW
    address: 40505
    data_type: INT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: power_consumption_day_kwh
    name: Current day power consumption, kWh
    address: 40509
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: electricity_sold_day_kwh
    name: Electricity sales volume of the day, kWh
    address: 40511
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: electricity_purchased_day_kwh
    name: Electricity purchased on the current day, kWh
    address: 40513
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0

  - metric_key: soc_percent
    name: SOC
    address: 40515
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 0.1
    offset: 0

  - metric_key: pcs_shutdown
    name: ESS PCS shut down
    address: 40540
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  # --- Shadow diagnostics (ems_edge_shadow_diagnostics.md §5/§7) ---
  # Same 1s ESS FC3 poll; all read-only.

  - metric_key: reactive_ess_power_kvar
    name: Reactive ESS power, kVar
    address: 40394
    data_type: INT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: ess_chargeable_kwh
    name: Chargeable ESS capacity, kWh
    address: 40480
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: ess_dischargeable_kwh
    name: Dischargeable ESS capacity, kWh
    address: 40482
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: ess_soe_pct
    name: ESS SOE, %
    address: 40517
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 0.1
    offset: 0

  - metric_key: pcs_in_operation
    name: ESS PCS in operation
    address: 40539
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  # SmartLogger alarm words 1..6 (Issue 52; Encombi reads them every
  # ESS cycle). Raw U16 bitmasks — shown as hex in the UI, any non-zero
  # word blocks virtual dispatch (reason_code=sl_alarm).
  - metric_key: sl_alarm_1
    name: SmartLogger alarm word 1
    address: 50000
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  - metric_key: sl_alarm_2
    name: SmartLogger alarm word 2
    address: 50001
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  - metric_key: sl_alarm_3
    name: SmartLogger alarm word 3
    address: 50002
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  - metric_key: sl_alarm_4
    name: SmartLogger alarm word 4
    address: 50003
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  - metric_key: sl_alarm_5
    name: SmartLogger alarm word 5
    address: 50004
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  - metric_key: sl_alarm_6
    name: SmartLogger alarm word 6
    address: 50005
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  # --- Plant inventory (rare poll; not in 1s telemetry whitelist) ---
  # Issue 52 Table 2-1: Gain column is divisor; our gain = 1/vendor_gain.

  - metric_key: pv_rated_kw
    name: Rated PV power, kW
    address: 40396
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: ess_rated_kw
    name: Rated ESS power, kW
    address: 40398
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: ess_rated_kwh
    name: Rated ESS capacity, kWh
    address: 40484
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0

  - metric_key: ess_count
    name: Number of ESSs
    address: 40488
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  - metric_key: pcs_count
    name: Number of PCSs
    address: 40489
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  - metric_key: ess_soh_pct
    name: ESS SOH, %
    address: 40516
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 0.1
    offset: 0

  - metric_key: active_power_control_mode
    name: Active power control mode
    address: 40737
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0

  # --- Edge-only cutover reads (ems_sl_write_cutover.md §12.2) ---
  # scope: edge — never polled by a full-catalog collector org: support
  # varies by firmware (50006/50007, 44364) and the meter sits behind
  # its own unit id, so an exception here must not fail a whole poll.

  # The setpoint registers read back: before MVP-3 this is the command
  # Encombi wrote last, after cutover the edge's own readback.
  - metric_key: pv_active_power_adjustment_kw
    name: PV active power adjustment in fixed value (40378), kW
    address: 40378
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.1
    offset: 0
    scope: edge

  - metric_key: ess_active_power_adjustment_kw
    name: ESS active power adjustment in fixed value (40381), kW
    address: 40381
    data_type: INT32
    swap_type: ABCD_BE
    gain: 0.1
    offset: 0
    scope: edge

  - metric_key: reactive_pv_power_kvar
    name: PV actual reactive power, kvar
    address: 40390
    data_type: INT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0
    scope: edge

  # Line voltages on the inverter (PV logger) / PCS (ESS logger) side.
  - metric_key: grid_line_voltage_ab_v
    name: A-B line voltage of grid, V
    address: 40575
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 0.1
    offset: 0
    scope: edge

  - metric_key: grid_line_voltage_bc_v
    name: B-C line voltage of grid, V
    address: 40576
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 0.1
    offset: 0
    scope: edge

  - metric_key: grid_line_voltage_ca_v
    name: C-A line voltage of grid, V
    address: 40577
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 0.1
    offset: 0
    scope: edge

  - metric_key: pcs_working_mode
    name: PCS working mode
    address: 44364
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0
    scope: edge

  # Alarm words 7..8 (Issue 52). Encombi reads only 50000…50005; on a
  # firmware that refuses them the edge falls back to six words.
  - metric_key: sl_alarm_7
    name: SmartLogger alarm word 7
    address: 50006
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0
    scope: edge

  - metric_key: sl_alarm_8
    name: SmartLogger alarm word 8
    address: 50007
    data_type: UINT16
    swap_type: ABCD_BE
    gain: 1
    offset: 0
    scope: edge

  # DTSU666-HW grid meter read through the SmartLogger: unit id = the
  # meter's RS485 address (ze: 11 on the PV logger). Issue 45 §2.4.
  - metric_key: meter_phase_a_voltage_v
    name: Grid meter phase A voltage, V
    address: 32260
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0
    scope: edge

  - metric_key: meter_phase_b_voltage_v
    name: Grid meter phase B voltage, V
    address: 32262
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0
    scope: edge

  - metric_key: meter_phase_c_voltage_v
    name: Grid meter phase C voltage, V
    address: 32264
    data_type: UINT32
    swap_type: ABCD_BE
    gain: 0.01
    offset: 0
    scope: edge

  # Meter sign convention: + = export to grid, − = import (the opposite
  # of 40505 in the EMS) — this pair is how the 40505 sign is verified.
  - metric_key: meter_active_power_kw
    name: Grid meter active power, kW (+ export)
    address: 32278
    data_type: INT32
    swap_type: ABCD_BE
    gain: 0.001
    offset: 0
    scope: edge
