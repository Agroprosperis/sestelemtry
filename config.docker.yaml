database_url: "postgres://postgres:postgres@timescaledb:5432/telemetry?sslmode=disable"
register_catalog: /etc/sestelemetry/registers/huawei_smartlogger.yaml
register_addressing:
  holding_address_base: 0
modbus_register_map: holding

organizations:
  - id: docker-demo
    name: Docker demo org
    poll_interval: 1s
    modbus:
      host: host.docker.internal
      port: 502
      unit_id: 99

  # ZE has two SmartLoggers behind one organization id. The first device
  # owns ESS-side metrics, the second owns PV/load metrics. Each device
  # only polls the registers it is responsible for; samples land in
  # telemetry_samples with organization_id=ze regardless of source.
  - id: ze
    name: ZE
    poll_interval: 1s
    # Coordinates are exposed to the dashboard via /api/v1/organizations
    # so the weather widget can fetch the local forecast without
    # hard-coding lat/lon in the frontend.
    location:
      latitude: 49.0191004
      longitude: 28.1260144
      city: "Жмеринка"
    # Expected plant passport (FusionSolar 2026-07-21); inventory poll
    # flags INVENTORY_MISMATCH when Modbus differs.
    inventory:
      pv_rated_kw: 600
      ess_rated_kw: 864
      ess_rated_kwh: 1720
      ess_count: 8
    modbus_devices:
      - host: 10.28.40.102          # UZE / ESS smartlogger
        port: 502
        unit_id: 99
        connect_timeout: 2s
        request_timeout: 2s
        metric_keys:
          - active_ess_power_kw
          - power_supply_from_grid_day_kwh
          - total_power_supply_from_grid_kwh
          - energy_charged_day_kwh
          - energy_discharged_day_kwh
          - total_energy_charged_kwh
          - total_energy_discharged_kwh
          - soc_percent
          # Per-device clock; lets ops spot a SmartLogger whose
          # internal time has drifted from the collector's UTC.
          - local_time_epoch_s
      - host: 10.28.40.101          # PV / load smartlogger
        port: 502
        unit_id: 99
        connect_timeout: 2s
        request_timeout: 2s
        metric_keys:
          - active_pv_power_kw
          - pv_energy_yield_day_kwh
          - accumulated_pv_energy_yield_kwh
          - accumulated_electricity_purchased_kwh
          - accumulated_electricity_sold_kwh
          - accumulated_power_consumption_kwh
          - load_power_kw
          - grid_connected_active_power_kw
          - power_consumption_day_kwh
          - electricity_sold_day_kwh
          - electricity_purchased_day_kwh
          - local_time_epoch_s

  - id: ab
    name: Агродар Бар
    poll_interval: 1s
    location:
      latitude: 49.0406538
      longitude: 27.7419296
      city: "Бар"
    inventory:
      pv_rated_kw: 450
      ess_rated_kw: 864
      ess_rated_kwh: 1720
      ess_count: 8
    modbus:
      host: 10.23.40.251
      port: 502
      unit_id: 99
      connect_timeout: 2s
      request_timeout: 2s

  - id: ke
    name: Кролевецький елеватор
    poll_interval: 1s
    location:
      latitude: 51.564077
      longitude: 33.375058
      city: "Кролевець"
    inventory:
      pv_rated_kw: 500
      ess_rated_kw: 324
      ess_rated_kwh: 645
      ess_count: 3
    modbus:
      host: 10.24.40.238
      port: 502
      unit_id: 99
      connect_timeout: 2s
      request_timeout: 2s

  # Поділля елеватор (PdE). Внутрішній id `pde` навмисно відмінний
  # від існуючого `pe` (інший фізичний сайт у Радивилові).
  - id: pde
    name: Поділля елеватор
    poll_interval: 1s
    location:
      latitude: 49.9993363781658
      longitude: 26.386386689961547
      city: "Поділля"
    inventory:
      pv_rated_kw: 250
      ess_rated_kw: 324
      ess_rated_kwh: 645
      ess_count: 3
    modbus:
      host: 10.33.40.241
      port: 502
      unit_id: 99
      connect_timeout: 2s
      request_timeout: 2s

  - id: de
    name: Дубовязівський елеватор
    poll_interval: 1s
    location:
      latitude: 51.15119965
      longitude: 33.383904
      city: "Дубовʼязівка"
    inventory:
      pv_rated_kw: 500
      ess_rated_kw: 540
      ess_rated_kwh: 1075
      ess_count: 5
    modbus:
      host: 10.34.40.241
      port: 502
      unit_id: 99
      connect_timeout: 2s
      request_timeout: 2s

  - id: sm
    name: Сорочанський мірошник
    poll_interval: 1s
    location:
      latitude: 49.066043
      longitude: 29.3634120
      city: "Сорочани"
    inventory:
      pv_rated_kw: 400
      ess_rated_kw: 324
      ess_rated_kwh: 645
      ess_count: 3
    modbus:
      host: 10.36.40.102
      port: 502
      unit_id: 99
      connect_timeout: 2s
      request_timeout: 2s

# Open-Meteo forecast cache. The weather-collector fetches a fresh
# forecast every `interval` for each org with a `location` block and
# upserts (organization_id, hour) rows. Elapsed hours/days are frozen
# (never overwritten), so the dashboard can render the archived
# forecast for past days. `past_days` re-pulls recent history each tick
# to backfill gaps (e.g. a newly added org or downtime). Set
# enabled: false to skip running the collector in this environment.
weather:
  enabled: true
  interval: 1h
  past_days: 7
  retry:
    attempts: 3
    backoff: 5s
