database_url: "postgres://postgres:postgres@timescaledb:5432/telemetry?sslmode=disable"
register_catalog: /etc/sestelemetry/registers/huawei_smartlogger.yaml
register_addressing:
  holding_address_base: 400001
modbus_register_map: holding

organizations:
  - id: docker-demo
    name: Docker demo org
    poll_interval: 1s
    modbus:
      host: host.docker.internal
      port: 502
      unit_id: 99

  # ZE has two SmartLoggers behind one organization id. The first device
  # owns ESS-side metrics, the second owns PV/load metrics. Each device
  # only polls the registers it is responsible for; samples land in
  # telemetry_samples with organization_id=ze regardless of source.
  - id: ze
    name: ZE
    poll_interval: 1s
    # Energy-flow calculator: derives ess_to_grid / ess_to_load /
    # pv_to_ess / grid_to_ess from per-second deltas of the
    # accumulator counters of both SmartLoggers and writes them to
    # the energy_flows hypertable. Defaults match the spec
    # ("ТЗ для агента: розрахунок потоків енергії УЗЕ").
    energy_flow:
      enabled: true
    modbus_devices:
      - host: 10.28.40.102          # UZE / ESS smartlogger
        role: ess
        port: 502
        unit_id: 99
        connect_timeout: 2s
        request_timeout: 2s
        metric_keys:
          - device_epoch_seconds
          - device_timezone_offset_seconds
          - device_dst_state
          - device_dst_offset_minutes
          - device_local_epoch_seconds
          - active_ess_power_kw
          - power_supply_from_grid_day_kwh
          - total_power_supply_from_grid_kwh
          - energy_charged_day_kwh
          - energy_discharged_day_kwh
          - total_energy_charged_kwh
          - total_energy_discharged_kwh
          - soc_percent
      - host: 10.28.40.101          # PV / load smartlogger
        role: pv
        port: 502
        unit_id: 99
        connect_timeout: 2s
        request_timeout: 2s
        metric_keys:
          - device_epoch_seconds
          - device_timezone_offset_seconds
          - device_dst_state
          - device_dst_offset_minutes
          - device_local_epoch_seconds
          - active_pv_power_kw
          - pv_energy_yield_day_kwh
          - accumulated_pv_energy_yield_kwh
          - accumulated_electricity_purchased_kwh
          - accumulated_electricity_sold_kwh
          - accumulated_power_consumption_kwh
          - load_power_kw
          - grid_connected_active_power_kw
          - power_consumption_day_kwh
          - electricity_sold_day_kwh
          - electricity_purchased_day_kwh
